name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nenchess
          POSTGRES_PASSWORD: nenchess
          POSTGRES_DB: nenchess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nenchess"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nenchess:nenchess@localhost:5432/nenchess
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --locked

      # The end-to-end test spawns the real server and drives it over HTTP and
      # WebSocket; it creates and migrates its own `nenchess_test` database.
      - name: End-to-end tests
        run: cargo test -p nenchess-integration --test e2e --locked -- --nocapture

  frontend:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (against Rust-generated contract)
        run: npm run typecheck

      - name: Build
        run: npm run build
