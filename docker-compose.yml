services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nenchess
      POSTGRES_PASSWORD: nenchess
      POSTGRES_DB: nenchess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nenchess -d nenchess"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgres://nenchess:nenchess@postgres:5432/nenchess
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
      # Only nginx reaches the API, so proxy headers identify the real client
      # for the auth rate limiter. The port is intentionally NOT published:
      # exposing it would let a client spoof X-Real-IP to bypass rate limits.
      TRUST_PROXY_HEADERS: "true"
      # ALLOWED_ORIGINS: "https://your.domain"   # when not browsing via localhost
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata:
